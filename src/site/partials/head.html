<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{full_title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta name="robots" content="{{robots}}">
<meta name="theme-color" content="#131110">
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="{{site_name}}">
<meta property="og:locale" content="fr_FR">
<meta property="og:title" content="{{full_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{origin}}/assets/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Gravity 1650, snack bar et restaurant au pied des pistes de Chamrousse 1650">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{full_title}}">
<meta name="twitter:description" content="{{description}}">
<meta name="twitter:image" content="{{origin}}/assets/og-image.png">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preload" href="/assets/fonts/archivo-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/assets/fonts/inter-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/css/style.css">
{{extra_head}}
{{breadcrumb_schema}}
{{extra_schema}}
<script>
(function(){try{var t=localStorage.getItem('g1650-theme');
if(!t)t=window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
document.documentElement.setAttribute('data-theme',t);
if(t==='light'){var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content','#F4F0E9');}
}catch(e){}})();
window.SITE_CONFIG={gaId:"{{ga_id}}"};
</script>
</head>
<body class="{{body_class}}">
<a class="skip-link" href="#contenu">Aller au contenu</a>
