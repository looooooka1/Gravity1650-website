<header class="site-header" data-header>
  <div class="wrap nav-wrap">
    <a class="brand" href="/">
      <b>GRAVITY</b>
      <span>1650 · CHAMROUSSE</span>
    </a>

    <nav class="nav-links" aria-label="Navigation principale">
      <a href="{{home}}#carte">La carte</a>
      <a href="{{home}}#horaires">Horaires</a>
      <a href="{{home}}#avis">Avis</a>
      <a href="{{home}}#faq">FAQ</a>
      <a href="{{home}}#acces">Accès</a>
    </nav>

    <div class="nav-side">
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Changer de thème" aria-pressed="false">
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.4M12 19.2v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M2.4 12h2.4M19.2 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"/></svg>
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.5 14.4A8.6 8.6 0 0 1 9.6 3.5a8.6 8.6 0 1 0 10.9 10.9Z"/></svg>
      </button>
      <a class="btn btn-primary btn-sm" href="tel:{{phone_tel}}">
        <svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.6.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1L6.6 10.8Z" fill="currentColor"/></svg>
        Appeler
      </a>
      <button class="nav-toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="menu-mobile">
        <span data-nav-label>Menu</span>
        <span class="nav-burger" aria-hidden="true"><i></i><i></i></span>
      </button>
    </div>
  </div>

  <div class="nav-panel" id="menu-mobile" hidden data-nav-panel>
    <nav aria-label="Navigation mobile">
      <a href="{{home}}#carte">La carte</a>
      <a href="{{home}}#horaires">Horaires</a>
      <a href="{{home}}#avis">Avis</a>
      <a href="{{home}}#faq">FAQ</a>
      <a href="{{home}}#acces">Accès</a>
      <a href="{{instagram}}" rel="noopener" target="_blank">Instagram</a>
    </nav>
    <div class="panel-foot">
      <p class="muted" data-hours-text>Horaires du jour en cours de chargement.</p>
      <a class="btn btn-primary" href="tel:{{phone_tel}}">Appeler le {{phone_display}}</a>
    </div>
  </div>
</header>
<main id="contenu" tabindex="-1">
