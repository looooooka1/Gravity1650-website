<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Archivo';src:url('assets/fonts/archivo-var.woff2') format('woff2');font-weight:100 900}
@font-face{font-family:'Inter';src:url('assets/fonts/inter-var.woff2') format('woff2');font-weight:100 700}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#131110}
.l{position:absolute;left:0;right:0;top:-330px}
.l img{width:1200px;height:1200px;object-fit:cover;object-position:center top;display:block}
.lf{top:-250px}
.veil{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(14,12,16,.55) 0%,rgba(14,12,16,0) 24%,rgba(14,12,16,0) 62%,rgba(14,12,16,.25) 100%)}
.mark{position:absolute;inset:0;display:grid;place-items:center;padding-bottom:30px;z-index:2}
.mark b{display:block;font-family:Archivo;font-weight:900;font-size:172px;line-height:.82;letter-spacing:-.05em;color:#111011;text-align:center}
.mark i{display:block;font-style:normal;font-family:Archivo;font-weight:800;font-size:84px;letter-spacing:.01em;text-align:center;color:#111011;margin-top:4px}
.top{position:absolute;top:44px;left:60px;font-family:Inter;font-size:18px;letter-spacing:.22em;text-transform:uppercase;color:rgba(247,240,231,.85);font-weight:600;z-index:5}
.bot{position:absolute;left:60px;right:60px;bottom:40px;display:flex;justify-content:space-between;align-items:flex-end;font-family:Inter;color:#F5EDE3;z-index:5}
.bot p{margin:0;font-size:27px;font-weight:500;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.bot span{font-size:24px;font-weight:700;background:#E0A96C;color:#17130F;padding:12px 20px;border-radius:11px}
</style></head><body>
<div class="l" style="z-index:1"><img src="assets/img/hero-back.webp" alt=""></div>
<div class="mark"><div><b>GRAVITY</b><i>1650</i></div></div>
<div class="l lf" style="z-index:3"><img src="assets/img/hero-front.webp" alt=""></div>
<div class="veil" style="z-index:4"></div>
<div class="top">Chamrousse 1650 · Recoin</div>
<div class="bot"><p>Snack, bar et restaurant<br>à 50 m des pistes.</p><span>06 74 08 71 67</span></div>
</body></html>
